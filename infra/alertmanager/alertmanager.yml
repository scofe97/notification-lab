# 02-01 실습용 Alertmanager 설정
#
# 수신처는 이미 떠 있는 MailHog(nlab-mailhog, SMTP 1025 / UI 8025)를 씁니다.
# 새 서비스를 늘리지 않으려고 기존 자산을 재사용했습니다.
# 받은 메일은 http://localhost:8025 에서 확인합니다.
#
# ⚠️ 타이머 3종과 라우팅 트리 상세는 05-01 이 SSOT 입니다.
#    여기 값은 실습에서 "빨리 보려고" 짧게 잡은 것이지 권장값이 아닙니다.

global:
  smtp_smarthost: "host.docker.internal:1025"
  smtp_from: "alertmanager@notification-lab.local"
  # MailHog 은 인증·TLS 없이 받습니다
  smtp_require_tls: false

route:
  # B-2: alertname 으로 묶습니다. instance 가 달라도 한 통으로 옵니다.
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
  receiver: mailhog

receivers:
  - name: mailhog
    email_configs:
      - to: "ops@notification-lab.local"
        send_resolved: true

# B-3: 억제 규칙.
# critical 이 떠 있는 동안, 같은 alertname·instance 를 가진 warning 은 발송되지 않습니다.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["instance"]
