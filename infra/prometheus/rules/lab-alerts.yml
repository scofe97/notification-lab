# B 검증용 알림 룰
#
# 실습이라 `for` 를 짧게 잡아 빨리 firing 시킵니다. 운영이라면 이렇게 짧게 두지 않습니다
# — 순간 스파이크마다 알림이 터집니다.
#
# ⚠️ 그룹핑 타이머 3종(group_wait·group_interval·repeat_interval)과 라우팅 트리 상세는
#    5장(05-01)이 SSOT 입니다. 여기서는 "이런 가공을 한다"는 존재 증명까지만 합니다.

groups:
  - name: lab-always-firing
    rules:
      # B-1·B-2 용: 반드시 뜨는 알림 2건.
      # 라벨(instance)이 달라서, Alertmanager 가 alertname 으로 묶으면 1건으로 합쳐집니다.
      - alert: LabAlwaysFiring
        expr: up{job="node-exporter"} == 1
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "실습용 상시 발사 알림 (node-exporter)"

      - alert: LabAlwaysFiring
        expr: up{job="prometheus"} == 1
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "실습용 상시 발사 알림 (prometheus)"

  - name: lab-inhibition
    rules:
      # B-3 용 억제 쌍.
      # 원인(critical)이 떠 있으면 결과(warning)는 눌립니다 —
      # "앱이 죽었다"가 이미 왔는데 "앱 응답이 느리다"까지 갈 이유가 없습니다.
      - alert: LabTargetDown
        expr: up{job="notification-service"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "원인 알림 — notification-service scrape 실패"

      - alert: LabTargetFlaky
        expr: up{job="notification-service"} == 0
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: "결과 알림 — 억제 대상 (critical 이 떠 있으면 눌림)"
