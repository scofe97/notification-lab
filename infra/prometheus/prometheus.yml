# 02-01 실습용 scrape 설정
#
# 실습 순서상 D-3 에서 metrics_path 를 일부러 빼고 실패를 봅니다.
# 그 용도의 job 은 아래 `notification-service-wrong-path` 로 미리 넣어 두었습니다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager 는 별개 프로세스입니다 — Prometheus 는 "누구에게 넘길지"만 압니다.
# B-1 에서 이 대상을 내린 채 룰을 firing 시켜 "발사는 되는데 아무 데도 안 감"을 봅니다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ── 자기 자신 (Prometheus 도 자기 메트릭을 냅니다) ──
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ── node-exporter (C 묶음의 주인공) ──
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # ── 앱: 호스트에서 bootRun 으로 뜬 notification-service (8092) ──
  #    Spring 은 /actuator/prometheus 로 냅니다 — 기본값 /metrics 가 아닙니다.
  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8092"]

  # ── D-3 전용: metrics_path 를 일부러 안 준 job ──
  #    기본값 /metrics 를 긁으므로 404 로 실패합니다. Targets 화면에서 대비해 보세요.
  - job_name: "notification-service-wrong-path"
    static_configs:
      - targets: ["host.docker.internal:8092"]

  # ── C-5 전용: Pushgateway ──
  #    honor_labels: true 가 중요합니다. 없으면 push 한 job/instance 라벨을
  #    Pushgateway 자신의 것으로 덮어써서, 배치가 보낸 정체가 사라집니다.
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
