# 02-01 실습 전용 — Prometheus 스택 (pull 축)
#
# 기존 observability profile(Loki·Mimir·Tempo·Alloy·Grafana)과 나란히 놓고 대비하기 위한
# 별도 profile 입니다. `--profile prometheus` 로만 뜨고, 내릴 때도 이 profile 만 내려갑니다.
# LGTM 은 영향받지 않습니다.
#
# ⛔ 이 파일은 ROADMAP 3-2 주차(Actuator·Micrometer·OTel, Alloy)를 앞당기지 않습니다.
#    config.alloy 스텁도 건드리지 않습니다 — 그건 3-2 주차 산출물입니다.

services:
  # ── 스택 구성요소 ① Prometheus 서버 (내부 4부품이 이 한 프로세스 안에 있음) ──
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: nlab-prometheus
    profiles: ["prometheus"]
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # A-2 에서 /tsdb-status 화면을 보려면 admin API 가 열려 있어야 합니다
      - "--web.enable-admin-api"
      - "--web.enable-lifecycle"
    extra_hosts:
      # 앱은 컨테이너가 아니라 호스트에서 bootRun 으로 뜹니다 (8092)
      - "host.docker.internal:host-gateway"

  # ── 스택 구성요소 ② exporter (별개 프로세스 — Prometheus 내부 부품이 아님) ──
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: nlab-node-exporter
    profiles: ["prometheus"]
    ports:
      - "9100:9100"
    volumes:
      # C-2·C-3 용 textfile collector 디렉토리
      - ../node-exporter/textfile:/var/lib/node_exporter/textfile:ro
    command:
      - "--collector.textfile.directory=/var/lib/node_exporter/textfile"

  # ── 스택 구성요소 ③ Alertmanager (별개 프로세스 — 알림 가공·발송 담당) ──
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: nlab-alertmanager
    profiles: ["prometheus"]
    ports:
      - "9093:9093"
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── C-5 전용: Pushgateway (push 축 — textfile 과 대비하려고 띄웁니다) ──
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: nlab-pushgateway
    profiles: ["prometheus"]
    ports:
      - "9091:9091"
