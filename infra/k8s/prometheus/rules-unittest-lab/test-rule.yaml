# 05-02 룰 단위 테스트 실습 — 테스트 대상 룰
#
# 정본: ~/runners-high/write/06_observability/book/mastering_prometheus/
#       05-02.견고한 알림과 룰 단위 테스트.md
#
# 문서 §"알림 룰 단위 테스트" ①의 룰을 그대로 옮겼습니다.
# 같은 조건을 last_over_time 으로 바꾼 룰을 하나 더 두어 두 함수의
# 발화 시점 차이를 한 번의 테스트로 견줍니다.

groups:
  - name: chapter5
    rules:
      # 문서 원본 — max_over_time
      # 5분 창의 최댓값이 1 이 아니어야 하므로 창 전체가 0 이어야 참이 됩니다.
      - alert: SSHDown
        expr: >
          max_over_time(
            probe_success{job="blackbox_ssh"}[5m]
          ) != 1
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          description: "Cannot SSH to {{ $labels.instance }}"

      # 비교군 — last_over_time
      # 창의 마지막 값만 보므로 창이 0 으로 채워지기를 기다리지 않습니다.
      - alert: SSHDownLast
        expr: >
          last_over_time(
            probe_success{job="blackbox_ssh"}[5m]
          ) != 1
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          description: "Cannot SSH to {{ $labels.instance }}"
