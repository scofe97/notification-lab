# nlab 네임스페이스 — Phase 3 실습 오브젝트 격리용
#
# 정본: ~/runners-high/write/06_observability/book/mastering_prometheus/
#       05-01.Alertmanager — 라우팅·그룹핑·억제·HA.md
#
# mon-lab(28h+ 자산)과 섞지 않는다 — 정리가 `delete ns nlab` 한 줄로 끝난다.
# 알림의 namespace 라벨도 갈려 억제·그룹핑 관찰이 쉬워진다.
# ⚠️ 그 라벨은 Operator relabeling 이 만든 것이라, 룰이 sum by (namespace, ...)
#    로 보존해야 살아남는다. 그냥 sum() 이면 사라져 라우팅 매처를 못 통과한다.
apiVersion: v1
kind: Namespace
metadata:
  name: nlab
  labels:
    purpose: mastering-prometheus-phase3
