# AlertmanagerConfig — 라우팅·타이머·리시버 (MailHog 발송)
#
# 정본: ~/runners-high/write/06_observability/book/mastering_prometheus/
#       05-01.Alertmanager — 라우팅·그룹핑·억제·HA.md
#
# alertmanagerConfigSelector 가 빈 {} 라 CR 수정 없이 병합된다(ruleSelector 와 반대).
# Operator 가 base 의 route.routes 아래 서브라우트로 넣으면서 namespace="nlab"
# 매처를 자동으로 붙인다 — 그래서 여기 매처를 직접 쓰지 않는다.
# group_wait 10s·group_by 에 alertname 추가는 분할 발송을 관측하기 위한 값이고,
# 운영에서는 이렇게 짧게·잘게 두지 않는다.
# ⚠️ requireTLS: false 필수 — 기본이 true 라 MailHog(STARTTLS 미지원)에서
#    "starttls not supported" 로 실패한다. 라우팅은 정상인데 메일만 안 온다.
# ⚠️ smarthost 의 이름은 nlab-mailhog-external.yaml 이 만든다(IP 는 거기 한 곳).
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: nlab-routing
  namespace: nlab
  labels:
    app: notification-service
spec:
  route:
    receiver: mailhog
    groupBy:
      - namespace
      - alertname     # 룰마다 그룹을 갈라 분할 발송이 제목으로 구분되게
    groupWait: 10s    # 첫 알림 후 묶어 보내기까지 (base 30s)
    groupInterval: 1m # 그룹에 새 알림이 붙었을 때 다음 발송까지
    repeatInterval: 10m
    routes:
      # critical 전용 분기 — 억제 규칙 실습 때 쓴다
      - receiver: mailhog-critical
        matchers:
          - name: severity
            value: critical
            matchType: "="
        groupWait: 10s
        groupInterval: 1m
        repeatInterval: 10m

  receivers:
    - name: mailhog
      emailConfigs:
        - to: "oncall@example.local"
          from: "alertmanager@example.local"
          smarthost: "mailhog.nlab.svc.cluster.local:1025"
          hello: "alertmanager.nlab"
          requireTLS: false
          sendResolved: true
          headers:
            - key: Subject
              value: '[nlab] {{ .GroupLabels.alertname }} ({{ .Alerts | len }}건)'

    - name: mailhog-critical
      emailConfigs:
        - to: "oncall-critical@example.local"
          from: "alertmanager@example.local"
          smarthost: "mailhog.nlab.svc.cluster.local:1025"
          hello: "alertmanager.nlab"
          requireTLS: false
          sendResolved: true
          headers:
            - key: Subject
              value: '[nlab][CRITICAL] {{ .GroupLabels.alertname }} ({{ .Alerts | len }}건)'
