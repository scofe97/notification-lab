# 04-01 문서 136행·337행 블록 — 설정 파일을 직접 쓰는 방식
#
# 정본: ~/runners-high/write/06_observability/book/mastering_prometheus/
#       04-01.서비스 디스커버리와 relabeling.md  (579줄)
#
# 문서 §2 가 이 통로를 이렇게 설명한다:
#   "Kubernetes 에서 오지 않는 모든 종류의 서비스 디스커버리는
#    Prometheus CRD 의 additionalScrapeConfigs 필드로 들어갑니다"
#
# 우리는 Kubernetes SD 를 쓰지만 ServiceMonitor 를 우회한다.
# 목적이 relabeling 을 직접 쓰는 것이기 때문이다 — ServiceMonitor 를 쓰면
# Operator 가 규칙을 대신 써서(S2 에서 20개 확인) 배울 대상이 사라진다.
#
# ⛔ 이 파일은 scrape_configs 배열의 "원소들"만 담는다. 최상위 키가 없다.
#    Secret 으로 감싸 Prometheus CR 이 참조하면 Operator 가 자기 설정 뒤에 이어붙인다.
#
# 반영:
#   kubectl -n mon-lab create secret generic additional-scrape-configs \
#     --from-file=prometheus-additional.yaml=infra/k8s/additional-scrape-configs.yaml \
#     --dry-run=client -o yaml | kubectl apply -f -
#
#   kubectl -n mon-lab patch prometheus kube-prom-kube-prometheus-prometheus \
#     --type merge -p '{"spec":{"additionalScrapeConfigs":{"name":"additional-scrape-configs","key":"prometheus-additional.yaml"}}}'

# ── 문서 136행 블록 (§3) — 두 시점을 한 job 에 나란히 ──
#
# 문서 원문 그대로:
#
#   - job_name: k8s-pods
#     kubernetes_sd_configs:
#       - role: pod                       # 후보를 가져오는 자리
#     relabel_configs:                    # 스크레이프 전 — 타깃을 고름
#       - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
#         regex: "true"
#         action: keep                    # 이 애너테이션이 true 인 파드만
#     metric_relabel_configs:             # 스크레이프 후 — 시계열을 버림
#       - source_labels: [__name__]
#         regex: go_gc_duration_seconds.* # 안 볼 메트릭 이름
#         action: drop
#
# 이 클러스터에는 prometheus.io/* 어노테이션을 가진 파드가 하나도 없다(실측 36개 중 0).
# 그래서 keep 이 0개를 만드는 것부터 관찰하고, kubectl annotate 로 살아나는 것을 본다.
- job_name: k8s-pods
  kubernetes_sd_configs:
    - role: pod                       # 후보를 가져오는 자리
  relabel_configs:                    # 스크레이프 전 — 타깃을 고름
    - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      regex: "true"
      action: keep                    # 이 애너테이션이 true 인 파드만
  metric_relabel_configs:             # 스크레이프 후 — 시계열을 버림
    # ⚠️ 이 규칙은 이 job 에서 효과가 0 이다.
    #    kiada 는 /metrics 를 내지 않아(포트 선언 없음 → 80 거부) 받아 온
    #    메트릭이 없고, 버릴 것도 없다. 문법은 유효하고 설정에도 들어가지만
    #    아무 일도 하지 않는다 — 실측: count({job="k8s-pods"}) = 18
    #    (up 3개 + Prometheus 가 붙이는 메타 15개. 앱 메트릭 0개)
    #
    #    metric_relabel_configs 는 **그 job 이 긁어온 메트릭에만** 적용된다.
    #    클러스터 전체에 go_gc_duration_seconds 가 140개 있지만 전부 다른
    #    job 소속이라 이 규칙과 무관하다.
    #
    #    효과를 눈으로 보려면 아래 http_sd_test job 을 참조한다 —
    #    같은 계열 메트릭이 실제로 21개 들어오는 job 이다.
    - source_labels: [__name__]
      regex: go_gc_duration_seconds.* # 안 볼 메트릭 이름
      action: drop

# ── 문서 337행 블록 (§8) — http_sd ──
#
# 문서 원문 그대로:
#
#   - job_name: http_sd_test
#     http_sd_configs:
#       - url: "http://http_sd:8888/targets"
#
# 문서 §8 이 지킬 것 셋을 적는다 — HTTP 200, Content-Type: application/json, UTF-8.
# 그리고 "보낼 타깃이 없을 때도 200 과 빈 배열" 이어야 한다.
#
# 대상 서버는 S5 에서 클러스터에 띄운다. 문서 306행 블록의 static config 를
# JSON 으로 옮긴 것을 응답으로 내준다.
# 호스트명은 그 Service 이름을 쓴다 — 문서의 http_sd 자리에 해당한다.
- job_name: http_sd_test
  http_sd_configs:
    - url: "http://http-sd.mon-lab.svc:8888/targets"

  # ── metric_relabel_configs 의 효과를 숫자로 보는 자리 ──
  #
  # 위 k8s-pods 의 같은 규칙은 효과가 0 이었다(대상이 메트릭을 안 냄).
  # 이 job 은 node-exporter 를 긁으므로 실제로 버릴 것이 있다.
  #
  # 실측 (2026-08-04, 노드 3개):
  #                              적용 전   적용 후   대조군(node-exporter job)
  #   전체 시계열                  4,949    4,634    5,006
  #   go_gc_duration_seconds*         21        0       21
  #   node_scrape_collector_*        294        0      294
  #
  # 대조군은 같은 파드 3개를 긁지만 규칙이 없어 그대로 저장한다.
  # 두 job 의 차이가 이 규칙의 효과다 — 스크레이프는 똑같이 하고
  # 저장 직전에 315개를 버린다. 네트워크 비용은 이미 냈고 디스크만 아낀다.
  #
  # relabel_configs 로는 이 일을 할 수 없다 — 스크레이프 전에는 __name__ 이 없다.
  #
  # ⚠️ Secret 을 고쳐도 반영이 즉시가 아니다. Operator 가 Secret 변경을
  #    감지해 설정을 다시 만들고, 그 Secret 이 파드 볼륨에 갱신되고,
  #    config-reloader 가 그것을 감지해 리로드를 걸기까지 1분 남짓 걸린다.
  #    조회가 옛 값을 보이면 리로드 로그의 타임스탬프를 먼저 확인한다:
  #      kubectl -n mon-lab logs prometheus-...-0 -c config-reloader --tail=2
  metric_relabel_configs:
    # Go 런타임 메트릭. 앱 코드가 아니라 언어 런타임이 내는 것이라
    # 대시보드에서 잘 안 보게 되는 대표적 계열이다.
    - source_labels: [__name__]
      regex: go_gc_duration_seconds.*
      action: drop

    # node-exporter 가 collector 마다 내는 자기 진단 메트릭.
    # collector 수 × 2(duration_seconds·success) 만큼 생긴다.
    - source_labels: [__name__]
      regex: node_scrape_collector_.*
      action: drop
